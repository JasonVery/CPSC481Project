<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <link rel="stylesheet" href="/styles/mainStyles.css">
    <script src="/scripts/routesForNavbar.js"></script>
</head>

<body>
    <div class="kioskBorder">
        <div class="kioskWrapper">
            <div class="navBar">
                <div class="navBtn" id="helpBtn">
                    <img src="/images/icons/Help.svg" class="navIcon">
                    <span class="navLabel">Request Assistance</span>
                </div>

                <div class="navBtn" id="loginBtn">
                    <img src="/images/icons/User.svg" class="navIcon">
                    <span class="navLabel">Login</span>
                </div>
            </div>
            <div class="mainCont">
                <div class="searchWrapper">
                    <img id="searchIcon" src="/images/icons/Search.svg">
                    <!-- Add input to here late -->
                </div>
                <div class="bookGenresCont">
                    <div class="genreAndTitleCont">
                        <h1>New</h1>
                        <div class="bookGenre">
                            <img class="leftRightIcons" src="/images/icons/leftIcon.svg">
                            <img class="book" src="/images/books/splendidSuns.svg">
                            <img class="book" src="/images/books/achilles.svg">
                            <img class="book" src="/images/books/midnightLib.svg">
                            <img class="book" src="/images/books/headsYouWith.svg">
                            <img class="leftRightIcons" src="/images/icons/rightIcon.svg">
                        </div>
                    </div>

                    <div class="genreAndTitleCont">
                        <h1>Classics</h1>
                        <div class="bookGenre">
                            <img class="leftRightIcons" src="/images/icons/leftIcon.svg">
                            <img class="book" src="/images/books/tender.svg">
                            <img class="book" src="/images/books/rye.svg">
                            <img class="book" src="/images/books/blossom.svg">
                            <img class="book" src="/images/books/paradise.svg">
                            <img class="leftRightIcons" src="/images/icons/rightIcon.svg">
                        </div>
                    </div>

                    <div class="genreAndTitleCont">
                        <h1>Mystery</h1>
                        <div class="bookGenre">
                            <img class="leftRightIcons" src="/images/icons/leftIcon.svg">
                            <img class="book" src="/images/books/sheGone.svg">
                            <img class="book" src="/images/books/patient.svg">
                            <img class="book" src="/images/books/longHome.svg">
                            <img class="book" src="/images/books/herrings.svg">
                            <img class="leftRightIcons" src="/images/icons/rightIcon.svg">
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

</body>

</html>
